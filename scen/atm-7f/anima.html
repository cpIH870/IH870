const pausaFinale = 3;   // Secondi di attesa alla fine

const durataTotaleCiclo = pausaIniziale + durataVolo + pausaFinale;

// Calcolo posizione (versione con interpolazione flessibile)
function calcolaPosizione(traiettoria, tNorm)
{
	const maxIndex = traiettoria.length - 1;
	const indiceFrazionario = tNorm * maxIndex;
	const indexBase = Math.floor(indiceFrazionario);
	const indexNext = Math.min(indexBase + 1, maxIndex);
	const fattoreInterpolazione = indiceFrazionario - indexBase;

	const pos = new THREE.Vector3();
	pos.lerpVectors(traiettoria[indexBase], traiettoria[indexNext], fattoreInterpolazione);

	return { pos, indexBase, indexNext, maxIndex };
}


// --- LOGICA TEMPORALE GESTITA A STATI ---
let faseAttuale = "pausaIniziale"; // Può essere: "pausaIniziale", "inVolo", "pausaFinale"
let timerPausa = 0; // Timer locale per gestire i secondi reali di orologio

function aggiornaSimulazione(deltaReale, moltiplicatore)
{
	switch (faseAttuale) {
		case "pausaIniziale": // Conta i secondi reali di orologio
			timerPausa += deltaReale;
			tNorm = 0; // Forza i modelli all'inizio

			if (timerPausa >= pausaIniziale) {
				faseAttuale = "inVolo";
				tempoSimulazione = 0; // Azzeriamo il tempo di volo pronto a partire
			}
			break;

		case "inVolo": // Il tempo di volo avanza scalato dallo slider
			tempoSimulazione += deltaReale * moltiplicatore;
			tNorm = tempoSimulazione / durataVolo;

			// Se il volo è terminato (tNorm >= 1) passa alla pausa finale
			if (tNorm >= 1) {
				tNorm = 1; // Blocca i modelli alla fine esatta
				faseAttuale = "pausaFinale";
				timerPausa = 0; // Resetta il timer per i 3 secondi successivi
			}
			break;

		case "pausaFinale": // Conta i secondi reali di orologio
			timerPausa += deltaReale;
			tNorm = 1; // Mantieni i modelli fermi a fine traiettoria

			if (timerPausa >= pausaFinale) {
				faseAttuale = "pausaIniziale"; // Ricomincia il loop da capo
				timerPausa = 0;
			}
			break;
	}
}


// ANIMAZIONE
function animate() 
{
	requestAnimationFrame(animate);

	const deltaReale = clock.getDelta();

	// Elabora lo stato dell'animazione (calcola internamente anche tNorm)
	aggiornaSimulazione(deltaReale, moltiplicatoreTempo);

	// --- AGGIORNAMENTO POSIZIONI E HUD ---
	const datiAereo = calcolaPosizione(traiettoriaAereo, tNorm);
	objectAereo.position.copy(datiAereo.pos);
	if (datiAereo.indexBase < datiAereo.maxIndex) {
		objectAereo.lookAt(traiettoriaAereo[datiAereo.indexNext]);
		// Ruota l'aereo attorno al suo asse verticale locale
		let angoloImbardata = THREE.MathUtils.degToRad(-11.2);
		objectAereo.rotateY(angoloImbardata);
	}

	const datiMissile = calcolaPosizione(traiettoriaMissile, tNorm);
	objectMissile.position.copy(datiMissile.pos);
	if (datiMissile.indexBase < datiMissile.maxIndex) objectMissile.lookAt(traiettoriaMissile[datiMissile.indexNext]);

	lblMISquota.innerText = objectMissile.position.y.toFixed(0);

	const idx = datiAereo.indexBase;
	const tel = telemetria[idx];
	if (tel) {
	  lblTempo.innerText = tel.t;
	  lblMISmach.innerText = tel.mach;
	  lblMISaccAP.innerText = tel.Agen;
	}
	lblMISdst.innerText = objectAereo.position.distanceTo(objectMissile.position).toFixed(1);

	controls.update();
	renderer.render(scene, camera);
}


animate();


function creaEtichettaCardinale(testo, posizione)
{
	// Canvas in memoria per disegnare il testo
	const canvas = document.createElement('canvas');
	canvas.width = 128; canvas.height = 128;
	const ctx = canvas.getContext('2d');

	// Stile del testo
	ctx.font = 'Bold 70px Arial';
	ctx.fillStyle = '#cc9933'; // Colore
	ctx.textAlign = 'center';
	ctx.textBaseline = 'middle';
	ctx.fillText(testo, 64, 64); // testo al centro del canvas

	// Trasformazione canvas in una texture di Three.js
	const texture = new THREE.CanvasTexture(canvas);
	const materialeSprite = new THREE.SpriteMaterial({ 
		map: texture, 
		transparent: true,
		depthTest: true // Mantiene la coerenza di profondità nella scena
	});

	// Creazione e posizionamento sprite
	const sprite = new THREE.Sprite(materialeSprite);
	sprite.position.copy(posizione);

	// Regola la dimensione visiva della lettera nello spazio 3D (proporzionata alla maxDim della griglia)
	const scalaLettera = maxDim * 0.05; 
	sprite.scale.set(scalaLettera, scalaLettera, 1);

	scene.add(sprite);
}


function impostaVista(tipo)
{
	const distanzaVisiva = maxDim * 1.3;
	const alt= 7700;//centroDati.y;

	camera.up.set(0, 1, 0); // RESET STANDARD: per default l'alto è l'asse Y (quota Up)
	controls.target.set(0, alt, 0); // Forza il mirino dei controlli a guardare esattamente lo zero (0, 0) alla quota dei dati

	switch(tipo) {
		case 'pianta':
		camera.up.set(0, 0, 1); // Forza l'alto verso il Nord (+Z)
		camera.position.set(0, alt + distanzaVisiva, 0); // Posiziona la camera sulla stessa verticale (0, 0)
		break;

		case 'ovest':
		camera.position.set(distanzaVisiva, alt, 0);
		break;

		case 'sud':
		camera.position.set(0, alt, -distanzaVisiva);
		break;
	}

	controls.update(); // Forza OrbitControls a digerire la nuova posizione, il nuovo target e il nuovo vettore UP
}

	const geometryPunta = new THREE.ConeGeometry(0.8, 2, 16);
	geometryPunta.rotateX(Math.PI / 2);
	const punta = new THREE.Mesh(geometryPunta, materiale);
	punta.position.z = 5;
	gruppo.add(punta);
	const geometryAletta = new THREE.BoxGeometry(0.1, 2.5, 1.5);
	const aletta1 = new THREE.Mesh(geometryAletta, materiale);
	aletta1.position.set(0, 0.8, -3.5);
	gruppo.add(aletta1);
	const aletta2 = aletta1.clone();
	aletta2.position.y = -0.8;
	gruppo.add(aletta2);
	const geometryAlettaOrizz = new THREE.BoxGeometry(2.5, 0.1, 1.5);
	const aletta3 = new THREE.Mesh(geometryAlettaOrizz, materiale);
	aletta3.position.set(0.8, 0, -3.5);
	gruppo.add(aletta3);
	const aletta4 = aletta3.clone();
	aletta4.position.x = -0.8;
	gruppo.add(aletta4);
	return gruppo;
}

function creaSagomaAereo(colore) {
	const gruppo = new THREE.Group();
	const materiale = new THREE.MeshLambertMaterial({ color: colore });
	const geometryFusoliera = new THREE.CylinderGeometry(1.5, 1.5, 15, 16);
	geometryFusoliera.rotateX(Math.PI / 2);
	const fusoliera = new THREE.Mesh(geometryFusoliera, materiale);
	gruppo.add(fusoliera);
	const geometryMuso = new THREE.ConeGeometry(1.5, 4, 16);
	geometryMuso.rotateX(Math.PI / 2);
	const muso = new THREE.Mesh(geometryMuso, materiale);
	muso.position.z = 9.5;
	gruppo.add(muso);
	const geometryAli = new THREE.BoxGeometry(16, 0.3, 4);
	const ali = new THREE.Mesh(geometryAli, materiale);
	ali.position.z = 1;
	gruppo.add(ali);
	const geometryCodaOrizz = new THREE.BoxGeometry(6, 0.2, 2);
	const codaOrizz = new THREE.Mesh(geometryCodaOrizz, materiale);
	codaOrizz.position.set(0, 0, -6.5);
	gruppo.add(codaOrizz);
	const geometryTimone = new THREE.BoxGeometry(0.2, 3, 2);
	const timone = new THREE.Mesh(geometryTimone, materiale);
	timone.position.set(0, 1.5, -6.5);
	gruppo.add(timone);
	return gruppo;
}
